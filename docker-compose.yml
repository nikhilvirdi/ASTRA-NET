services:
  postgres:
    image: postgres:16
    container_name: astranet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astranet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astranet_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-astranet}
    ports:
      - '5433:5432'
    volumes:
      - astranet_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-astranet}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  astranet_pg_data:
