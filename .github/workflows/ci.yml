name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astranet
          POSTGRES_PASSWORD: astranet_ci_password
          POSTGRES_DB: astranet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astranet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://astranet:astranet_ci_password@localhost:5432/astranet
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate (CI database)
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm test

      - name: Coverage gate — packages/shared must be 100%
        run: npm run test:coverage --workspace=packages/shared -- --coverage.thresholds.lines=100 --coverage.thresholds.functions=100 --coverage.thresholds.branches=100 --coverage.thresholds.statements=100

      - name: Build
        run: npm run build